name: GitHub Actions Demo
run-name: ${{ github.actor }} is deploying an SPA
on: [push]

jobs:
  
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url  }}
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/checkout@v4
