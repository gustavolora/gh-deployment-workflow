name: GitHub Actions
run-name: ${{ github.actor }} is deploying an SPA
on:
  push:
    branches: ["main"]
  workflow_dispatch:

    
    
concurrency:

  group: "pages"
  cancel-in-progress: false


permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url  }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        used: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
